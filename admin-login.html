<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | ReConnect</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e8fff3, #eef7ff);
    color: #17352a;
}

/* NAVBAR */

nav {
    height: 70px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #159957;
    font-size: 24px;
    font-weight: bold;
}

.logo-mark {
    width: 42px;
    height: 42px;
    background: #159957;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.back-link {
    color: #333;
    text-decoration: none;
    font-weight: bold;
}

/* PAGE */

.page {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

.icon {
    width: 70px;
    height: 70px;
    background: #e8fff3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
}

h1 {
    text-align: center;
    color: #176b4d;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

/* FORM */

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #ccdcd4;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #159957;
}

button {
    width: 100%;
    padding: 15px;
    background: #159957;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #117c47;
}

button:disabled {
    background: #9ab9aa;
}

/* MESSAGE */

#message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    line-height: 1.5;
}

.error {
    background: #fff0f0;
    color: #c62828;
}

.success {
    background: #edfff4;
    color: #168044;
}

.user-login {
    text-align: center;
    margin-top: 20px;
}

.user-login a {
    color: #159957;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>


<body>


<nav>

    <div class="logo">

        <div class="logo-mark">
            R
        </div>

        ReConnect

    </div>


    <a href="index.html" class="back-link">
        ← Back to Website
    </a>

</nav>



<div class="page">

    <div class="card">

        <div class="icon">
            🔐
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            Login to manage ReConnect
        </p>


        <form id="adminLoginForm">


            <label>
                Admin Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                id="loginButton">

                Login as Admin

            </button>


        </form>


        <div id="message"></div>


        <div class="user-login">

            <a href="login.html">
                ← Go to User Login
            </a>

        </div>

    </div>

</div>



<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBenWnZJHPp-4aBqNoGKfXZrZU9sMJwocA",

    authDomain: "reconn-dd697.firebaseapp.com",

    projectId: "reconn-dd697",

    storageBucket: "reconn-dd697.firebasestorage.app",

    messagingSenderId: "948055569162",

    appId: "1:948055569162:web:37dc21c34c4a70423180f3",

    measurementId: "G-H4VT58ZZP1"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const form =
    document.getElementById("adminLoginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    button.disabled = true;

    button.textContent = "Checking...";


    try {

        /* LOGIN */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        console.log("Login successful:", user.uid);


        /* FIND ADMIN */

        const adminQuery = query(
            collection(db, "admins"),
            where("email", "==", email)
        );


        const adminSnapshot =
            await getDocs(adminQuery);


        if (adminSnapshot.empty) {

            await signOut(auth);

            showMessage(
                "Login worked, but this email is not found in the admins collection.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        const adminData =
            adminSnapshot.docs[0].data();


        /* CHECK ROLE */

        if (adminData.role !== "admin") {

            await signOut(auth);

            showMessage(
                "This account is not an admin account.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        /* CHECK STATUS */

        if (
            adminData.status &&
            adminData.status !== "active"
        ) {

            await signOut(auth);

            showMessage(
                "This admin account is not active.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        /* SUCCESS */

        showMessage(
            "Admin login successful!",
            "success"
        );


        setTimeout(function() {

            window.location.href =
                "admin-dashboard.html";

        }, 800);

    }


    catch(error) {

        console.error(error);

        let text =
            "Login failed.";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            text =
                "Wrong email or password.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            text =
                "Admin email is not registered in Firebase.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            text =
                "Wrong password.";

        }

        else {

            text =
                "Firebase error: " +
                error.code;

        }


        showMessage(
            text,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Login as Admin";

    }

});

</script>


</body>

</html>
