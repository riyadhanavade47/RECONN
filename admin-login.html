<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ReConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8fff3, #eef7ff);
            display: flex;
            flex-direction: column;
        }

        nav {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #159957;
        }

        .logo-circle {
            width: 42px;
            height: 42px;
            background: #159957;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
        }

        .admin-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8fff3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #176b4d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d7e3dd;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #159957;
            box-shadow: 0 0 0 3px rgba(21,153,87,0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #159957;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #117c47;
        }

        button:disabled {
            background: #9ab9aa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fff0f0;
            color: #c62828;
        }

        .success {
            background: #edfff4;
            color: #168044;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #159957;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">

        <div class="logo-circle">
            R
        </div>

        ReConnect

    </div>


    <a href="index.html">
        ← Back to Website
    </a>

</nav>



<div class="container">

    <div class="login-card">

        <div class="admin-icon">
            🔐
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            Secure access to the ReConnect administration panel.
        </p>


        <form id="adminLoginForm">


            <label for="email">
                Admin Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                id="loginButton">

                Login as Admin

            </button>


        </form>


        <div
            id="message"
            class="message">
        </div>


        <div class="back">

            <a href="login.html">
                ← Go to User Login
            </a>

        </div>


    </div>

</div>



<footer>

    © 2026 ReConnect | Admin Portal

</footer>



<script type="module">


/* =========================
   FIREBASE
   ========================= */


import {

    getAuth,
    signInWithEmailAndPassword,
    signOut

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {

    getFirestore,
    collection,
    query,
    where,
    getDocs

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


import {

    app

} from "./firebase-config.js";


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =========================
   ELEMENTS
   ========================= */


const form =
    document.getElementById(
        "adminLoginForm"
    );


const button =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );



/* =========================
   MESSAGE
   ========================= */


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}



/* =========================
   ADMIN LOGIN
   ========================= */


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        button.disabled =
            true;


        button.textContent =
            "Checking...";


        message.style.display =
            "none";


        try {


            /* =========================
               1. FIREBASE AUTH LOGIN
               ========================= */


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;



            /* =========================
               2. FIND USER IN FIRESTORE
               ========================= */


            const usersQuery =
                query(

                    collection(
                        db,
                        "users"
                    ),

                    where(
                        "uid",
                        "==",
                        user.uid
                    )

                );


            const usersSnapshot =
                await getDocs(
                    usersQuery
                );



            /* =========================
               3. ADMIN PROFILE CHECK
               ========================= */


            if (
                usersSnapshot.empty
            ) {

                await signOut(auth);


                showMessage(

                    "Admin profile was not found in Firestore. Please check the uid field.",

                    "error"

                );


                button.disabled =
                    false;


                button.textContent =
                    "Login as Admin";


                return;

            }



            /* =========================
               4. GET USER DATA
               ========================= */


            const userData =
                usersSnapshot
                    .docs[0]
                    .data();



            /* =========================
               5. CHECK ROLE
               ========================= */


            if (
                userData.role !==
                "admin"
            ) {

                await signOut(auth);


                showMessage(

                    "This account is not authorized as an administrator.",

                    "error"

                );


                button.disabled =
                    false;


                button.textContent =
                    "Login as Admin";


                return;

            }



            /* =========================
               6. CHECK STATUS
               ========================= */


            if (

                userData.status &&
                userData.status !==
                "active"

            ) {

                await signOut(auth);


                showMessage(

                    "This administrator account is not active.",

                    "error"

                );


                button.disabled =
                    false;


                button.textContent =
                    "Login as Admin";


                return;

            }



            /* =========================
               7. SUCCESS
               ========================= */


            showMessage(

                "Admin verified. Opening dashboard...",

                "success"

            );


            setTimeout(
                () => {

                    window.location.href =
                        "admin-dashboard.html";

                },

                800
            );


        }


        catch (error) {


            console.error(
                "Admin login error:",
                error
            );


            let errorMessage =
                "Unable to login. Please check your email and password.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                errorMessage =
                    "Incorrect email or password.";

            }


            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                errorMessage =
                    "No account exists with this email.";

            }


            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                errorMessage =
                    "Incorrect password.";

            }


            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                errorMessage =
                    "Too many login attempts. Please try again later.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "Login as Admin";

        }

    }

);

</script>


</body>

</html>
