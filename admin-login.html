<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBenWnZJHPp-4aBqNoGKfXZrZU9sMJwocA",

    authDomain: "reconn-dd697.firebaseapp.com",

    projectId: "reconn-dd697",

    storageBucket: "reconn-dd697.firebasestorage.app",

    messagingSenderId: "948055569162",

    appId: "1:948055569162:web:37dc21c34c4a70423180f3",

    measurementId: "G-H4VT58ZZP1"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const form =
    document.getElementById("adminLoginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;

    button.textContent = "Checking...";

    message.style.display = "none";


    try {

        /* ================================
           1. LOGIN WITH FIREBASE
           ================================ */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = result.user;

        console.log("LOGIN SUCCESS");
        console.log("UID:", user.uid);
        console.log("EMAIL:", user.email);


        /* ================================
           2. CHECK USERS COLLECTION
           USING UID AS DOCUMENT ID
           ================================ */

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );

        const userSnap =
            await getDoc(userRef);


        console.log(
            "Users document exists:",
            userSnap.exists()
        );


        if (!userSnap.exists()) {

            await signOut(auth);

            showMessage(
                "Login worked, but the admin document was not found. Make sure the Firestore users Document ID is EXACTLY the same as the Firebase Authentication UID.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        const data =
            userSnap.data();


        console.log(
            "Firestore data:",
            data
        );


        /* ================================
           3. CHECK ADMIN ROLE
           ================================ */

        if (data.role !== "admin") {

            await signOut(auth);

            showMessage(
                "The account exists, but the role is not admin. Change the role field to admin.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        /* ================================
           4. CHECK STATUS
           ================================ */

        if (
            data.status &&
            data.status !== "active"
        ) {

            await signOut(auth);

            showMessage(
                "The admin account is not active. Change status to active.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login as Admin";

            return;
        }


        /* ================================
           5. SUCCESS
           ================================ */

        showMessage(
            "Admin login successful! Opening dashboard...",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "admin-dashboard.html";

        }, 800);


    } catch (error) {

        console.error(
            "Firebase error:",
            error
        );

        console.error(
            "Error code:",
            error.code
        );


        let text =
            "Login failed.";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            text =
                "Wrong email or password.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            text =
                "This email is not registered in Firebase Authentication.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            text =
                "Wrong password.";

        }

        else if (
            error.code ===
            "permission-denied"
        ) {

            text =
                "Firestore permission denied.";

        }

        else {

            text =
                "Firebase error: " +
                error.code;

        }


        showMessage(
            text,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Login as Admin";

    }

});

</script>
